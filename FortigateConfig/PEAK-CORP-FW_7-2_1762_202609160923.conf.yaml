 <h1 class=\"text-centered\">
 Terms and Disclaimer Agreement
 </h1>
 <form action=\"%%HEMAIL_ACTION%%\" method=\"%%HEMAIL_METHOD%%\">
 <input type=\"hidden\" name=\"%%REDIRID%%\" value=\"%%PROTURI%%\">
 <input type=\"hidden\" name=\"%%MAGICID%%\" value=\"%%MAGICVAL%%\">
 <p class=\"text-scrollable text-container\">
 You are about to access Internet content that is not under the control of the network access provider. The network access provider is therefore not responsible for any of these sites, their content or their privacy policies. The network access provider and its staff do not endorse nor make any representations about these sites, or any information, software or other products or materials found there, or any results that may be obtained from using them. If you decide to access any Internet content, you do this entirely at your own risk and you are responsible for ensuring that any accessed material does not infringe the laws governing, but not exhaustively covering, copyright, trademarks, pornography, or any other material which is slanderous, defamatory or might cause offence in any other way.
 </p>
 <div class=\"text-container\">
 <input type=\"checkbox\" name=\"agree\" id=\"ft_ad\" required=\"required\" onclick=\"document.getElementById(\'ft_un\').disabled = !this.checked;\">
 <label for=\"ft_ad\">
 I accept the Terms and Disclaimer Agreement
 </label>
 </div>
 <div class=\"flex-container text-container column\">
 <p>
 <b>
 Please enter your Email address to continue.
 </b>
 </p>
 <div class=\"field single\">
 <label for=\"ft_un\">
 Email
 </label>
 <div>
 <input name=\"%%USERNAMEID%%\" id=\"ft_un\" type=\"email\" autocorrect=\"off\" autocapitalize=\"off\" disabled>
 </div>
 </div>
 <div class=\"form-footer\">
 <button class=\"primary\" type=\"submit\" id=\"ft_ci\">
 Continue
 </button>
 </div>
 </div>
 </form>
 </div>
 <script>
 var def_msg = \"Please enter your Email address to continue.\";
 var cb = get(\"ft_ad\");
 var un = get(\"ft_un\");
 var ci = get(\"ft_ci\");
 var note = get(\"note\");
 var adl = get(\"ft_adl\");
 if (cb && un && note && adl) {
 cb.onclick = cb_click;
 cb_click.apply(cb, [def_msg]);
 }
 function get(x) {
 return document.getElementById(x);
 }
 function tc(elm, cn, tg) {
 if (!elm) return;
 if (tg) elm.className += \" \" + cn;
 else elm.className = elm.className.replace(cn,\'\');
 }
 function cb_click(msg) {
 var en = !this.checked;
 un.disabled = en;
 ci.disabled = en;
 tc(adl, \"hl\", en);
 tc(note, \"hl\", !en);
 if(typeof msg === \"string\") {
 note.innerHTML = msg;
 }
 else {
 note.innerHTML = def_msg;
 }
 }
 </script>
 </body>
</html>
"

