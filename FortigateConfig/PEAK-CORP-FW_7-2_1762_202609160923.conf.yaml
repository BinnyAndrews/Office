 Continue
 </button>
 <button type=\"button\" id=\"skip\" onclick=\"form.%%PASSWORDID%%.value=\'\'; form.password2.value=\'\'; form.submit();\">
 Skip
 </button>
 </div>
 </form>
 <script>
 var expire_days = %%EXPIREDAYS%%;
 if (expire_days < 0) {
 document.write(\"Your password has expired.\");
 }
 else if (expire_days == 0) {
 document.write(\"Your password is expiring.\");
 }
 else if (expire_days == 1) {
 document.write(\"Your password will expire in 1 day.\");
 }
 else {
 document.write(\"Your password will expire in %%EXPIREDAYS%% days.\");
 }
 </script>
 <script>
 document.forms[0].skip.focus();
 function keydownhandler(event){
 if (event.keyCode == 13) document.forms[0].continue.focus();
 } function form_check(){
 var form=document.forms[0];
 if (form.%%PASSWORDID%%.value != form.password2.value) {
 alert(\'The entered passwords do not match\');
 return false;
 }
 return true;
 }
 </script>
 </div>
 </body>
</html>
