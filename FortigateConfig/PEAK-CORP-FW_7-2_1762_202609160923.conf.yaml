system_ipam:
    pools:
        - default-pool:
            subnet: 172.31.0.0 255.255.0.0

        - lan-pool:
            subnet: 192.168.0.0 255.255.0.0


    rules:
        - role-lan:
            device: "*"
            interface: "*"
            role: lan
            pool: "lan-pool"
            dhcp: enable



